name: CI workflow

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu:latest
    container: 
      image: python:3.9-slim
    steps:
    - name: checkout 
      uses: actions/checkout@v4
    - name: checkout the code
      run: |
        apt-get update && apt-get install docker.io -y
        docker build -t myimage:v1 .